# Windows edge collector sample config for 0.3.2.
# Every component in this file is valid on Windows.
# Every receiver collects at the send interval because there is no windowhist yet.
# Placeholder gateway host and host identity; the role writes the real values.
# The winlog processor is in the Windows manifest and wired into the logs
# pipeline below.

extensions:
  file_storage:
    directory: C:\ProgramData\otelcol-edge\storage
    create_directory: true
  health_check:
    endpoint: 127.0.0.1:13133
  zpages:
    endpoint: 127.0.0.1:55679
receivers:
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
      paging:
      load:
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.handles:
            enabled: true
          process.threads:
            enabled: true
        mute_process_exe_error: true
        mute_process_name_error: true
        mute_process_io_error: true
        mute_process_user_error: true
  # Fixed local drives only; the role adds removable or network drives.
  hostmetrics/filesystem:
    collection_interval: 15m
    scrapers:
      filesystem:
        include_fs_types:
          match_type: strict
          fs_types: [NTFS, ReFS]
  windowsperfcounters:
    collection_interval: 60s
    metrics:
      windows.physicaldisk.queue_length:
        description: Current disk queue length
        unit: "{operation}"
        gauge:
      windows.physicaldisk.avg_queue_length:
        description: Average disk queue length
        unit: "{operation}"
        gauge:
      windows.physicaldisk.operation_latency:
        description: Average seconds per disk operation
        unit: s
        gauge:
      windows.physicaldisk.idle_time:
        description: Percent of time the disk was idle
        unit: "%"
        gauge:
      windows.physicaldisk.transfers:
        description: Disk transfers per second
        unit: "{operation}/s"
        gauge:
      windows.physicaldisk.io:
        description: Disk bytes per second
        unit: By/s
        gauge:
      windows.memory.committed:
        description: Committed bytes
        unit: By
        gauge:
      windows.memory.commit_limit:
        description: Commit limit
        unit: By
        gauge:
      windows.memory.pages:
        description: Memory pages per second
        unit: "{page}/s"
        gauge:
      windows.tcp.retransmitted_segments:
        description: TCP segments retransmitted per second
        unit: "{segment}/s"
        gauge:
      windows.network_interface.output_queue_length:
        description: Network interface output queue length
        unit: "{packet}"
        gauge:
      windows.system.processor_queue_length:
        description: Processor queue length
        unit: "{thread}"
        gauge:
    perfcounters:
      - object: PhysicalDisk
        instances: ["*"]
        counters:
          - name: Current Disk Queue Length
            metric: windows.physicaldisk.queue_length
          - name: Avg. Disk Queue Length
            metric: windows.physicaldisk.avg_queue_length
          - name: Avg. Disk sec/Read
            metric: windows.physicaldisk.operation_latency
            attributes:
              disk.io.direction: read
          - name: Avg. Disk sec/Write
            metric: windows.physicaldisk.operation_latency
            attributes:
              disk.io.direction: write
          - name: "% Idle Time"
            metric: windows.physicaldisk.idle_time
          - name: Disk Transfers/sec
            metric: windows.physicaldisk.transfers
          - name: Disk Read Bytes/sec
            metric: windows.physicaldisk.io
            attributes:
              disk.io.direction: read
          - name: Disk Write Bytes/sec
            metric: windows.physicaldisk.io
            attributes:
              disk.io.direction: write
      - object: Memory
        counters:
          - name: Committed Bytes
            metric: windows.memory.committed
          - name: Commit Limit
            metric: windows.memory.commit_limit
          - name: Pages/sec
            metric: windows.memory.pages
      - object: TCPv4
        counters:
          - name: Segments Retransmitted/sec
            metric: windows.tcp.retransmitted_segments
            attributes:
              network.type: ipv4
      - object: TCPv6
        counters:
          - name: Segments Retransmitted/sec
            metric: windows.tcp.retransmitted_segments
            attributes:
              network.type: ipv6
      - object: Network Interface
        instances: ["*"]
        counters:
          - name: Output Queue Length
            metric: windows.network_interface.output_queue_length
      - object: System
        counters:
          - name: Processor Queue Length
            metric: windows.system.processor_queue_length
  # Event logs are on by default, Security included; the
  # winlog processor drops its routine audit events. Each channel keeps its
  # bookmark in file_storage.
  windowseventlog/security:
    channel: Security
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  windowseventlog/system:
    channel: System
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  windowseventlog/application:
    channel: Application
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  # The role puts every other channel into crc32 buckets like this one.
  windowseventlog/bucket-0:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Microsoft-Windows-PowerShell/Operational">*</Select>
        </Query>
      </QueryList>
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
    # File logs, disabled. Uncomment an entry and add it to the logs pipeline.
    # The role appends C:\ProgramData\otelcol-edge\logs\** to every exclude.
    #
    # filelog/iis-w3c:
    #   include: ['C:\inetpub\logs\LogFiles\W3SVC*\*.log']
    #   exclude: ['C:\ProgramData\otelcol-edge\logs\**']
    #   start_at: end
    #   storage: file_storage
    #   include_file_path: true
    #   operators:
    #     - type: add
    #       field: attributes["log.source"]
    #       value: iis-w3c
    #     - type: copy
    #       from: body
    #       to: attributes.original_message
    #
    # filelog/app:
    #   include: ['C:\ProgramData\MyApp\logs\*.log']
    #   exclude: ['C:\ProgramData\otelcol-edge\logs\**']
    #   start_at: end
    #   storage: file_storage
    #   include_file_path: true
    #   multiline:
    #     line_start_pattern: '^\d{4}-\d{2}-\d{2}'
    #   operators:
    #     - type: add
    #       field: attributes["log.source"]
    #       value: myapp
    #     - type: copy
    #       from: body
    #       to: attributes.original_message
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        host.ip:
          enabled: true
        os.type:
          enabled: true
  resource/host:
    attributes:
      - key: deployment.environment
        value: production
        action: insert
      - key: service.name
        value: otelcol-edge
        action: insert
  resourceversion:
    role: edge
  # Shapes event records and drops the default list. Remove a rule to keep its
  # events; the list replaces the built-in defaults.
  winlog:
    original_message_max_bytes: 65536
    drop_rules:
      - name: security-audit-noise
        channels: [Security]
        event_ids: ["4624", "4634", "4672", "4658", "5156", "5158"]
      - name: collector-self-info
        levels: [4]
        providers: [otelcol-edge]
  normalizedload:
    cpu_count: 0
  # Same low-resource rule as the Linux edge; thresholds are role variables.
  filter/process:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "process.memory.usage" and value_double < 52428800.0'
        - 'metric.name == "process.cpu.utilization" and value_double < 0.001'
exporters:
  otlphttp:
    endpoint: http://otel-main.example.invalid:4318
    compression: gzip
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 1073741824
service:
  extensions: [file_storage, health_check, zpages]
  telemetry:
    logs:
      level: info
      output_paths: ["rotating:///C:/ProgramData/otelcol-edge/logs/otelcol-edge.log"]
      error_output_paths: ["rotating:///C:/ProgramData/otelcol-edge/logs/otelcol-edge.log"]
    # Counters otelcol_winlog_events_read and _dropped leave through this
    # exporter with the resource attributes below.
    resource:
      host.name: HOST-PLACEHOLDER
      host.id: 00000000-0000-0000-0000-000000000000
      host.ip: 192.0.2.10
      os.type: windows
      service.name: otelcol-edge
      deployment.environment: production
      collector.edge.version: 0.3.2
    metrics:
      level: normal
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://otel-main.example.invalid:4318
  pipelines:
    metrics:
      receivers: [hostmetrics, hostmetrics/filesystem, windowsperfcounters]
      processors: [memory_limiter, filter/process, normalizedload, resourcedetection, resource/host, resourceversion]
      exporters: [otlphttp]
    logs:
      receivers: [windowseventlog/security, windowseventlog/system, windowseventlog/application, windowseventlog/bucket-0]
      processors: [memory_limiter, winlog, resourcedetection, resource/host, resourceversion]
      exporters: [otlphttp]
