# Windows edge collector sample config for 0.3.1 (plan 08 Step 1.3, SPARC 05).
# Valid Windows components only: no gpu, psi or journald (05 FR-014).
# Every receiver collects at the send interval because 0.3.1 has no windowhist.
# Placeholder gateway host; the role writes the real endpoint.

extensions:
  file_storage:
    directory: C:\ProgramData\otelcol-edge\storage
    create_directory: true
  health_check:
    endpoint: 127.0.0.1:13133
  zpages:
    endpoint: 127.0.0.1:55679
receivers:
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
      paging:
      load:
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.handles:
            enabled: true
          process.threads:
            enabled: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
  # Fixed local drives only (D-44); the role adds removable or network drives.
  hostmetrics/filesystem:
    collection_interval: 15m
    scrapers:
      filesystem:
        include_fs_types:
          match_type: strict
          fs_types: [NTFS, ReFS]
  windowsperfcounters:
    collection_interval: 60s
    metrics:
      windows.physical_disk.queue_length.current:
        description: Current disk queue length
        unit: "{request}"
        gauge:
      windows.physical_disk.queue_length.average:
        description: Average disk queue length
        unit: "{request}"
        gauge:
      windows.physical_disk.read.time:
        description: Average seconds per disk read
        unit: s
        gauge:
      windows.physical_disk.write.time:
        description: Average seconds per disk write
        unit: s
        gauge:
      windows.physical_disk.idle.time:
        description: Percent of time the disk was idle
        unit: "%"
        gauge:
      windows.physical_disk.transfers:
        description: Disk transfers per second
        unit: "{transfer}/s"
        gauge:
      windows.physical_disk.read.rate:
        description: Disk read bytes per second
        unit: By/s
        gauge:
      windows.physical_disk.write.rate:
        description: Disk write bytes per second
        unit: By/s
        gauge:
      windows.memory.committed:
        description: Committed bytes
        unit: By
        gauge:
      windows.memory.commit_limit:
        description: Commit limit
        unit: By
        gauge:
      windows.memory.pages:
        description: Memory pages per second
        unit: "{page}/s"
        gauge:
      windows.tcp.retransmits:
        description: TCP segments retransmitted per second
        unit: "{segment}/s"
        gauge:
      windows.network_interface.output_queue_length:
        description: Network interface output queue length
        unit: "{packet}"
        gauge:
      windows.system.processor_queue_length:
        description: Processor queue length
        unit: "{thread}"
        gauge:
    perfcounters:
      - object: PhysicalDisk
        instances: ["*"]
        counters:
          - name: Current Disk Queue Length
            metric: windows.physical_disk.queue_length.current
          - name: Avg. Disk Queue Length
            metric: windows.physical_disk.queue_length.average
          - name: Avg. Disk sec/Read
            metric: windows.physical_disk.read.time
          - name: Avg. Disk sec/Write
            metric: windows.physical_disk.write.time
          - name: "% Idle Time"
            metric: windows.physical_disk.idle.time
          - name: Disk Transfers/sec
            metric: windows.physical_disk.transfers
          - name: Disk Read Bytes/sec
            metric: windows.physical_disk.read.rate
          - name: Disk Write Bytes/sec
            metric: windows.physical_disk.write.rate
      - object: Memory
        counters:
          - name: Committed Bytes
            metric: windows.memory.committed
          - name: Commit Limit
            metric: windows.memory.commit_limit
          - name: Pages/sec
            metric: windows.memory.pages
      - object: TCPv4
        counters:
          - name: Segments Retransmitted/sec
            metric: windows.tcp.retransmits
      - object: Network Interface
        instances: ["*"]
        counters:
          - name: Output Queue Length
            metric: windows.network_interface.output_queue_length
      - object: System
        counters:
          - name: Processor Queue Length
            metric: windows.system.processor_queue_length
  # Event logs are on by default, Security included and unfiltered until 0.3.2
  # (D-45). Each channel keeps its bookmark in file_storage.
  windowseventlog/security:
    channel: Security
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  windowseventlog/system:
    channel: System
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  windowseventlog/application:
    channel: Application
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
  # The role puts every other channel into crc32 buckets like this one.
  windowseventlog/bucket-0:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Microsoft-Windows-PowerShell/Operational">*</Select>
        </Query>
      </QueryList>
    start_at: end
    storage: file_storage
    include_log_record_original: true
    raw: false
    ignore_channel_errors: true
    # File logs, disabled. Uncomment an entry and add it to the logs pipeline.
    # The role appends C:\ProgramData\otelcol-edge\logs\** to every exclude.
    #
    # filelog/iis-w3c:
    #   include: ['C:\inetpub\logs\LogFiles\W3SVC*\*.log']
    #   exclude: ['C:\ProgramData\otelcol-edge\logs\**']
    #   start_at: end
    #   storage: file_storage
    #   include_file_path: true
    #   operators:
    #     - type: add
    #       field: attributes["log.source"]
    #       value: iis-w3c
    #     - type: copy
    #       from: body
    #       to: attributes.original_message
    #
    # filelog/app:
    #   include: ['C:\ProgramData\MyApp\logs\*.log']
    #   exclude: ['C:\ProgramData\otelcol-edge\logs\**']
    #   start_at: end
    #   storage: file_storage
    #   include_file_path: true
    #   multiline:
    #     line_start_pattern: '^\d{4}-\d{2}-\d{2}'
    #   operators:
    #     - type: add
    #       field: attributes["log.source"]
    #       value: myapp
    #     - type: copy
    #       from: body
    #       to: attributes.original_message
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        host.ip:
          enabled: true
        os.type:
          enabled: true
  resource/host:
    attributes:
      - key: deployment.environment
        value: production
        action: insert
      - key: service.name
        value: otelcol-edge
        action: insert
  resourceversion:
    role: edge
  normalizedload:
    cpu_count: 0
  # Same low-resource rule as the Linux edge; thresholds are role variables.
  filter/process:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "process.memory.usage" and value_double < 52428800.0'
        - 'metric.name == "process.cpu.utilization" and value_double < 0.001'
exporters:
  otlphttp:
    endpoint: http://otel-main.example.invalid:4318
    compression: gzip
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 1073741824
service:
  extensions: [file_storage, health_check, zpages]
  telemetry:
    logs:
      level: info
      output_paths: ["rotating:///C:/ProgramData/otelcol-edge/logs/otelcol-edge.log"]
      error_output_paths: ["rotating:///C:/ProgramData/otelcol-edge/logs/otelcol-edge.log"]
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [hostmetrics, hostmetrics/filesystem, windowsperfcounters]
      processors: [memory_limiter, filter/process, normalizedload, resourcedetection, resource/host, resourceversion]
      exporters: [otlphttp]
    logs:
      receivers: [windowseventlog/security, windowseventlog/system, windowseventlog/application, windowseventlog/bucket-0]
      processors: [memory_limiter, resourcedetection, resource/host, resourceversion]
      exporters: [otlphttp]
