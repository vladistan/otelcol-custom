# Reference config for otelcol-scrape.
# Placeholders only: every credential and endpoint comes from ${env:...}.
# Deploy only the sources whose Secret exists, with their pipelines;
# a pipeline with no receivers fails config load.
#
# Env: OTEL_MAIN_OTLP_ENDPOINT, AWS_REGION, CLOUDTRAIL_BUCKET, CLOUDTRAIL_SQS_URL,
# S3ACCESS_BUCKET, S3ACCESS_PREFIX, S3ACCESS_SQS_URL, ALB_BUCKET, ALB_PREFIX,
# ALB_SQS_URL, AUTH0_SQS_URL,
# AUTH0_SQS_REGION, AUTH0_ROLE_ARN, AUTH0_EXTERNAL_ID, GCP_PROJECT,
# GCP_CLOUDRUN_SUBSCRIPTION, GCP_AUDIT_SUBSCRIPTION, GCP_MON_PROJECT_A,
# GCP_MON_PROJECT_B, AZ_EH_CONN.
# AWS and GCP credentials come from the SDK default chains and
# GOOGLE_APPLICATION_CREDENTIALS, not from this file.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 127.0.0.1:55679
  file_storage:
    directory: /var/lib/otel/storage
    create_directory: true
    timeout: 10s
  aws_logs_encoding/cloudtrail:
    format: cloudtrail
  aws_logs_encoding/s3access:
    format: s3access
  aws_logs_encoding/elbaccess:
    format: elbaccess
  google_cloud_logentry_encoding: {}
receivers:
  # CloudTrail: org trail bucket, SQS-driven, one log record per Records[] entry.
  # The receiver strips .gz before it matches the suffix.
  aws_s3/cloudtrail:
    s3downloader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:CLOUDTRAIL_BUCKET}
      s3_prefix: AWSLogs/
    sqs:
      queue_url: ${env:CLOUDTRAIL_SQS_URL}
      region: ${env:AWS_REGION}
    encodings:
      - extension: aws_logs_encoding/cloudtrail
        suffix: .json
  # S3 server access logs: object keys have no suffix, so the suffix is empty.
  aws_s3/s3access:
    s3downloader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:S3ACCESS_BUCKET}
      s3_prefix: ${env:S3ACCESS_PREFIX}
    sqs:
      queue_url: ${env:S3ACCESS_SQS_URL}
      region: ${env:AWS_REGION}
    encodings:
      - extension: aws_logs_encoding/s3access
        suffix: ""
  # ALB access logs: objects are <prefix>AWSLogs/<account>/elasticloadbalancing/.../*.log.gz.
  # The receiver strips .gz, so the suffix is .log.
  aws_s3/alb:
    s3downloader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:ALB_BUCKET}
      s3_prefix: ${env:ALB_PREFIX}
    sqs:
      queue_url: ${env:ALB_SQS_URL}
      region: ${env:AWS_REGION}
    encodings:
      - extension: aws_logs_encoding/elbaccess
        suffix: .log
  awscloudwatch/logs:
    region: ${env:AWS_REGION}
    storage: file_storage
    logs:
      poll_interval: 1m
      # Ends each window 30s before now so late-ingested events are read next poll.
      settle_lag: 30s
      groups:
        autodiscover:
          prefix: /aws/lambda/
          limit: 50
  # CloudWatch metrics: named metrics only, no discovery.
  awscloudwatch/metrics:
    region: ${env:AWS_REGION}
    metrics:
      collection_interval: 5m
      period: 5m
      delay: 10m
      queries:
        - {namespace: AWS/EC2, metric_name: CPUUtilization, stats: [Average]}
        - {namespace: AWS/EC2, metric_name: NetworkIn, stats: [Sum]}
        - {namespace: AWS/EC2, metric_name: NetworkOut, stats: [Sum]}
        - {namespace: AWS/RDS, metric_name: CPUUtilization, stats: [Average]}
        - {namespace: AWS/RDS, metric_name: DatabaseConnections, stats: [Average]}
        - {namespace: AWS/RDS, metric_name: FreeStorageSpace, stats: [Minimum]}
        - {namespace: AWS/Lambda, metric_name: Invocations, stats: [Sum]}
        - {namespace: AWS/Lambda, metric_name: Errors, stats: [Sum]}
        - {namespace: AWS/Lambda, metric_name: Duration, stats: [Average, p99]}
        - {namespace: AWS/Lambda, metric_name: Throttles, stats: [Sum]}
        - {namespace: AWS/ApplicationELB, metric_name: RequestCount, stats: [Sum]}
        - {namespace: AWS/ApplicationELB, metric_name: HTTPCode_Target_5XX_Count, stats: [Sum]}
        - {namespace: AWS/ApplicationELB, metric_name: TargetResponseTime, stats: [Average, p99]}
  auth0:
    queue_url: ${env:AUTH0_SQS_URL}
    region: ${env:AUTH0_SQS_REGION}
    role_arn: ${env:AUTH0_ROLE_ARN}
    external_id: ${env:AUTH0_EXTERNAL_ID}
  googlecloudpubsub/cloudrun:
    project: ${env:GCP_PROJECT}
    subscription: ${env:GCP_CLOUDRUN_SUBSCRIPTION}
    encoding: google_cloud_logentry_encoding
    ignore_encoding_error: true
  googlecloudpubsub/audit:
    project: ${env:GCP_PROJECT}
    subscription: ${env:GCP_AUDIT_SUBSCRIPTION}
    encoding: google_cloud_logentry_encoding
    ignore_encoding_error: true
  # Cloud Run metrics: one instance per project, because project_id takes one project.
  googlecloudmonitoring/cloudrun-a:
    project_id: ${env:GCP_MON_PROJECT_A}
    collection_interval: 5m
    metrics_list:
      - metric_name: run.googleapis.com/request_count
      - metric_name: run.googleapis.com/request_latencies
      - metric_name: run.googleapis.com/container/cpu/utilizations
      - metric_name: run.googleapis.com/container/memory/utilizations
      - metric_name: run.googleapis.com/container/instance_count
  googlecloudmonitoring/cloudrun-b:
    project_id: ${env:GCP_MON_PROJECT_B}
    collection_interval: 5m
    metrics_list:
      - metric_name: run.googleapis.com/request_count
      - metric_name: run.googleapis.com/request_latencies
      - metric_name: run.googleapis.com/container/cpu/utilizations
      - metric_name: run.googleapis.com/container/memory/utilizations
      - metric_name: run.googleapis.com/container/instance_count
  azure_event_hub:
    connection: ${env:AZ_EH_CONN}
    format: azure
    storage: file_storage
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch: {}
  resource_detection:
    detectors: [env]
  # Tags records with log.source and event.category and fills cloud resource
  # attributes; one instance per provider.
  sourcetag/aws:
    provider: aws
  sourcetag/gcp:
    provider: gcp
  sourcetag/azure:
    provider: azure
  # Fills host.name, service.name and an empty audit body on GCP audit records.
  # Runs in logs/gcp only, after sourcetag/gcp. AWS and Azure records carry none
  # of the attributes it reads.
  identityfill: {}
exporters:
  otlp_http:
    endpoint: ${env:OTEL_MAIN_OTLP_ENDPOINT}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 10000
      storage: file_storage
  debug:
    verbosity: basic
service:
  extensions:
    - health_check
    - zpages
    - file_storage
    - aws_logs_encoding/cloudtrail
    - aws_logs_encoding/s3access
    - aws_logs_encoding/elbaccess
    - google_cloud_logentry_encoding
  pipelines:
    logs/aws:
      receivers: [aws_s3/cloudtrail, aws_s3/s3access, aws_s3/alb, awscloudwatch/logs, auth0]
      # No batch: the persistent queue in otlp_http must be the first buffer, because
      # aws_s3 and auth0 delete queue messages once the next consumer accepts them.
      processors: [memory_limiter, sourcetag/aws, resource_detection]
      exporters: [otlp_http]
    logs/gcp:
      receivers: [googlecloudpubsub/cloudrun, googlecloudpubsub/audit]
      processors: [memory_limiter, sourcetag/gcp, identityfill, resource_detection, batch]
      exporters: [otlp_http]
    logs/azure:
      receivers: [azure_event_hub]
      processors: [memory_limiter, sourcetag/azure, resource_detection, batch]
      exporters: [otlp_http]
    metrics/aws:
      receivers: [awscloudwatch/metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
    metrics/gcp:
      receivers: [googlecloudmonitoring/cloudrun-a, googlecloudmonitoring/cloudrun-b]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
