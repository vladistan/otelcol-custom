# Local Gateway Collector Test Configuration
# Use for local development and debugging with VS Code
#
# Run: ./build/otelcol-custom --config test/configs/local-gateway.yaml
#      ./build/gateway/otelcol-gateway --config test/configs/local-gateway.yaml
# Or use VS Code launch configuration: "Debug Full Collector" or "Debug Gateway Collector"
#
# This config:
# - Receives OTLP from edge collectors or test tools
# - Receives syslog for network device testing
# - Uses debug exporter (stdout) instead of Elasticsearch
# - Includes transform processors for log parsing
# - No external dependencies required

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  zpages:
    endpoint: 127.0.0.1:55679
receivers:
  # OTLP receiver - accepts from edge collectors and instrumented apps
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # UDP log receiver for syslog/network device logs
  udp_log/syslog:
    listen_address: 0.0.0.0:1514
    operators:
      - type: regex_parser
        regex: '^<(?P<priority>\d+)>(?P<message>.*)'
        parse_from: body
        parse_to: attributes
        on_error: send
  # TCP log receiver for syslog/network device logs
  tcp_log/syslog:
    listen_address: 0.0.0.0:1515
    operators:
      - type: regex_parser
        regex: '^<(?P<priority>\d+)>(?P<message>.*)'
        parse_from: body
        parse_to: attributes
        on_error: send
  # File-based log receiver for testing with sample data
  file_log/testdata:
    include:
      - testdata/**/*.txt
      - testdata/**/*.log
      - testdata/**/*.raw
    start_at: beginning
    include_file_name: true
    include_file_path: true
    operators:
      - type: add
        field: attributes.source
        value: testdata
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 500
    send_batch_max_size: 1000
  # Transform journald logs from edge collectors
  # yamllint disable rule:line-length
  transform/journald:
    log_statements:
      - context: log
        conditions:
          - IsMap(body)
        statements:
          # Each attribute is set only when the resource has no value or an
          # empty one, so a value from an earlier stage (service.name from a
          # container name on the edge) is kept. A resource shared by records
          # with different journal fields takes the first record's values;
          # the native journald processor splits such records instead.
          # Host and machine information
          - set(resource.attributes["host.name"], body["_HOSTNAME"]) where body["_HOSTNAME"] != nil and (resource.attributes["host.name"] == nil or resource.attributes["host.name"] == "")
          - set(resource.attributes["host.id"], body["_MACHINE_ID"]) where body["_MACHINE_ID"] != nil and (resource.attributes["host.id"] == nil or resource.attributes["host.id"] == "")
          # Process information
          - set(resource.attributes["process.pid"], body["_PID"]) where body["_PID"] != nil and (resource.attributes["process.pid"] == nil or resource.attributes["process.pid"] == "")
          - set(resource.attributes["process.command"], body["_COMM"]) where body["_COMM"] != nil and (resource.attributes["process.command"] == nil or resource.attributes["process.command"] == "")
          # Service information
          - set(resource.attributes["service.name"], body["_SYSTEMD_UNIT"]) where body["_SYSTEMD_UNIT"] != nil and (resource.attributes["service.name"] == nil or resource.attributes["service.name"] == "")
          # Convert PRIORITY to OTEL severity levels
          - set(severity_number, SEVERITY_NUMBER_FATAL) where body["PRIORITY"] != nil and Int(body["PRIORITY"]) <= 2
          - set(severity_text, "FATAL") where body["PRIORITY"] != nil and Int(body["PRIORITY"]) <= 2
          - set(severity_number, SEVERITY_NUMBER_ERROR) where body["PRIORITY"] == "3"
          - set(severity_text, "ERROR") where body["PRIORITY"] == "3"
          - set(severity_number, SEVERITY_NUMBER_WARN) where body["PRIORITY"] == "4"
          - set(severity_text, "WARN") where body["PRIORITY"] == "4"
          - set(severity_number, SEVERITY_NUMBER_INFO) where body["PRIORITY"] == "5" or body["PRIORITY"] == "6"
          - set(severity_text, "INFO") where body["PRIORITY"] == "5" or body["PRIORITY"] == "6"
          - set(severity_number, SEVERITY_NUMBER_DEBUG) where body["PRIORITY"] == "7"
          - set(severity_text, "DEBUG") where body["PRIORITY"] == "7"
  # yamllint enable rule:line-length
  # Native equivalent of transform/journald: maps PRIORITY to severity and
  # lifts journald fields into resource attributes. Defined here and not wired
  # into a pipeline.
  journald:
    set_resource: true
    map_severity: true
    body_from_message: true
    split_resources: true
    keep_fields: true
  # Sets severity on logs from the matched namespace and container. match is
  # required: a config without it fails at startup. Defined here and not wired
  # into a pipeline.
  snoozelog:
    match:
      - namespace: shop
        container: worker
  # Fills empty host.name and service.name on cluster and GCP audit logs, and
  # builds the audit body. The defaults apply. Defined here and not wired into
  # a pipeline.
  identityfill: {}
  # Health probe sampling: keeps 20% of the successful health-check requests
  # (status 200 or 302 on a probe path or from a probe agent); a failed probe
  # always passes. It runs after logshape, which writes the HTTP attributes it reads.
  healthprobe:
    enabled: true
    keep_ratio: 0.2
  # Log shaping: the text of known formats becomes one-line bodies with official
  # attribute names. The nine old log processors stay in the image for a rollback;
  # ciscolog below is defined and no longer wired, because logshape reads the same
  # lines. The cloud sources are shaped by the scrape image, so they are not enabled.
  # Every gateway of a rollout runs the same image tag, so one config shape fits them all.
  logshape:
    branches:
      - flow
      - klog
      - uvicorn
      - collector
      - mongod
      - gcpjson
      - tracing
      - pino
      - logrus
      - postgres
      - redis
      - nginx
      - sentry
      - cisco
      - syslog
      - influx
      - oauth2proxy
      - coredns
      - rabbitmq
      - mosquitto
      - stallcheck
      - kaudit
      - smartd
      - gocd
      - cron
      - openvpn
      - pbs
      - pve
      - serialconsole
      - logfmt
      - clickhouse
      - calico
      - ssmagent
      - litellm
      - stderrhint
      - lldpd
      - k8s
      - charon
      - autoscaler
    # transform/syslog keeps the raw syslog line in original_message.
    cisco:
      source_attribute: original_message
    syslog:
      source_attribute: original_message
  # Transform syslog logs (pfsense, network devices)
  transform/syslog:
    log_statements:
      - context: log
        statements:
          # Copy priority to syslog.priority attribute
          - set(attributes["syslog.priority"], attributes["priority"]) where attributes["priority"] != nil
          # Save original message for ciscolog processor
          - set(attributes["original_message"], attributes["message"]) where attributes["message"] != nil
          # Copy message body if parsed
          - set(body, attributes["message"]) where attributes["message"] != nil
  # Cisco/HP network log parser - extracts facility, severity, mnemonic
  # Handles formats not parsed by transform/syslog (WLC, bare mnemonics, HP switches)
  ciscolog:
    source_attribute: original_message
    set_hostname: true
    clean_body: true
  # Add dataset attribute for ELK routing
  attributes/dataset:
    actions:
      - key: event.dataset
        from_attribute: data_stream.dataset
        action: upsert
  # Resource detection for local testing
  resource_detection:
    detectors: [system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
  # Add development environment marker
  resource/dev:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
exporters:
  # Debug exporter - prints to stdout with sampling
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 20
  # File exporter for persistent output review
  file/logs:
    path: /tmp/otel-gateway-logs.json
    rotation:
      max_megabytes: 50
      max_backups: 3
  file/metrics:
    path: /tmp/otel-gateway-metrics.json
    rotation:
      max_megabytes: 10
      max_backups: 3
  file/traces:
    path: /tmp/otel-gateway-traces.json
    rotation:
      max_megabytes: 10
      max_backups: 3
service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: debug
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    # Logs from OTLP (edge collectors, instrumented apps)
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, transform/journald, logshape, healthprobe, attributes/dataset, batch]
      exporters: [debug, file/logs]
    # Logs from syslog (network devices)
    logs/syslog:
      receivers: [udp_log/syslog, tcp_log/syslog]
      processors: [memory_limiter, transform/syslog, logshape, resource_detection, resource/dev, batch]
      exporters: [debug, file/logs]
    # Logs from testdata files
    logs/testdata:
      receivers: [file_log/testdata]
      processors: [memory_limiter, resource_detection, resource/dev, batch]
      exporters: [debug, file/logs]
    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/metrics]
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/traces]
