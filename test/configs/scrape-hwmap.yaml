# Scrape pod that maps raw SNMP metrics to hw.* names with the hwmap processor (docs/hwmap.md).
#
# The hwmap rules read metrics named in the snmp receiver config. This sample declares the interface byte
# counters, the interface state, the interface speed and the uptime only, to stay short; a real config declares
# a metric for each source below (snmp.sensor.temperature and so on) with its column OID, and puts the index and
# name columns in `attributes`. All names, indexes and values here are documentation examples.
#
# Validate the rule block with the unit tests of the processor, which load this file:
#   go test ./processor/hwmapprocessor -run TestSample
# Validate the whole config with the environment set (values only need to be present):
#   SNMP_SWITCH_HOST=192.0.2.3 SNMP_SWITCH_COMMUNITY=c otelcol-scrape validate --config test/configs/scrape-hwmap.yaml
#
# Secrets come from the environment, never from this file.

receivers:
  snmp/switch:
    collection_interval: 60s
    endpoint: udp://${env:SNMP_SWITCH_HOST}:161
    version: v2c
    community: ${env:SNMP_SWITCH_COMMUNITY}
    attributes:
      interface:
        oid: "1.3.6.1.2.1.31.1.1.1.1" # IF-MIB ifName
      interface.index:
        oid: "1.3.6.1.2.1.2.2.1.1" # IF-MIB ifIndex
    metrics:
      snmp.interface.in.bytes:
        unit: By
        description: Octets received, IF-MIB ifHCInOctets
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.31.1.1.1.6"
            attributes:
              - name: interface
              - name: interface.index
      snmp.interface.out.bytes:
        unit: By
        description: Octets sent, IF-MIB ifHCOutOctets
        sum:
          aggregation: cumulative
          monotonic: true
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.31.1.1.1.10"
            attributes:
              - name: interface
              - name: interface.index
      snmp.interface.oper.status:
        unit: "1"
        description: Operational state, IF-MIB ifOperStatus (1 up, 2 down, 3 testing, 4 unknown, 5 dormant, 6 notPresent, 7 lowerLayerDown)
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.8"
            attributes:
              - name: interface
              - name: interface.index
      snmp.system.uptime:
        unit: cs
        description: Time since the agent started in centiseconds, SNMPv2-MIB sysUpTime
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.2.1.1.3.0"
      snmp.interface.high_speed:
        unit: Mbit/s
        description: Current interface speed, IF-MIB ifHighSpeed
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.31.1.1.1.15"
            attributes:
              - name: interface
              - name: interface.index
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  hwmap:
    rules:
      # Value of a sensor table: the index and name come from columns of the same row.
      - name: sensor-temperature
        match:
          metric: snmp.sensor.temperature
        target: hw.temperature
        unit: Cel
        labels:
          hw.type: temperature
          hw.id: "{entity.index}"
          hw.name: "{entity.name}"
        resource:
          hw.vendor: Example
          hw.model: Model 1
      # A threshold of 0 means unset: no point.
      - name: sensor-temperature-limit
        match:
          metric: snmp.sensor.temperature.threshold
        target: hw.temperature.limit
        unit: Cel
        drop_when_value: 0
        labels:
          hw.type: temperature
          hw.id: "{entity.index}"
          hw.name: "{entity.name}"
        constants:
          hw.limit_type: high.critical
      # Enum of an environment table: 1 normal, 2 warning, 3 critical, 4 shutdown, 5 not present, 6 not functioning.
      - name: sensor-state
        match:
          metric: snmp.sensor.state
        target: hw.status
        labels:
          hw.type: temperature
          hw.id: "{entity.index}"
          hw.name: "{entity.name}"
        status:
          states: [ok, degraded, failed]
          map:
            "1": ok
            "2": degraded
            "3": failed
            "4": failed
            "5": drop
            "6": failed
      # Sensors that have no names over SNMP: a fixed map from the index.
      - name: board-temperature
        match:
          metric: snmp.board.temperature
        target: hw.temperature
        unit: Cel
        labels:
          hw.type: temperature
        index_names:
          attribute: entity.index
          names:
            "1001": Board A
            "1002": Board B
      # A text state. Only GOOD is listed; any other text, such as Warning, counts as degraded and keeps its
      # raw text in hw.status.raw.
      - name: disk-smart
        match:
          metric: snmp.disk.smart
        target: hw.status
        labels:
          hw.type: physical_disk
          hw.id: "HDD{disk.slot}"
          hw.name: "{disk.descr}"
        status:
          source: attribute
          attribute: smart
          states: [ok, degraded, failed]
          default_state: degraded
          map:
            GOOD: ok
      # Millidegrees to degrees Celsius.
      - name: disk-temperature
        match:
          metric: snmp.disk.temperature.milli
        target: hw.temperature
        unit: Cel
        scale: 0.001
        labels:
          hw.type: physical_disk
          hw.id: "HDD{disk.slot}"
          hw.name: "{disk.descr}"
      # KiB to bytes.
      - name: volume-size
        match:
          metric: snmp.volume.size
        target: hw.logical_disk.limit
        unit: By
        scale: 1024
        labels:
          hw.type: logical_disk
          hw.name: "{volume.name}"
      # Percent to a ratio.
      - name: lun-utilization
        match:
          metric: snmp.lun.used.percent
        target: hw.logical_disk.utilization
        unit: "1"
        scale: 0.01
        labels:
          hw.type: logical_disk
          hw.id: "{lun.id}"
          hw.name: "{lun.name}"
        constants:
          iscsi.lun: "true"
      # Milliwatts to watts.
      - name: poe-port-allocated
        match:
          metric: snmp.poe.port.allocated
        target: poe.port.power
        unit: W
        scale: 0.001
        labels:
          hw.id: "{port.index}"
          network.interface.name: "{port.name}"
        constants:
          poe.measure: allocated
      # Interface counters keep their type: a cumulative sum leaves as a cumulative sum. The index and the name
      # come from columns of the same row; a point with no name gets no hw.name.
      - name: interface-in-bytes
        match:
          metric: snmp.interface.in.bytes
        target: hw.network.io
        unit: By
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: receive
      - name: interface-out-bytes
        match:
          metric: snmp.interface.out.bytes
        target: hw.network.io
        unit: By
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: transmit
      - name: interface-in-errors
        match:
          metric: snmp.interface.in.errors
        target: hw.errors
        unit: "{error}"
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: receive
          error.type: interface
      - name: interface-out-errors
        match:
          metric: snmp.interface.out.errors
        target: hw.errors
        unit: "{error}"
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: transmit
          error.type: interface
      # Packet counters. Keep these two rules only when the snmp receiver config declares
      # snmp.interface.in.packets and snmp.interface.out.packets (ifHCInUcastPkts and ifHCOutUcastPkts count
      # unicast packets only).
      - name: interface-in-packets
        match:
          metric: snmp.interface.in.packets
        target: hw.network.packets
        unit: "{packet}"
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: receive
      - name: interface-out-packets
        match:
          metric: snmp.interface.out.packets
        target: hw.network.packets
        unit: "{packet}"
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        constants:
          network.io.direction: transmit
      # ifOperStatus is an enum: 1 is up and any other value is not. The point is 1 or 0, and the state name
      # stays in hw.network.oper_state. A value outside 1 to 7 gives 0 with the number kept, and is counted.
      - name: interface-oper-status
        match:
          metric: snmp.interface.oper.status
        target: hw.network.up
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
        enum_gauge:
          on: ["1"]
          state_attribute: hw.network.oper_state
          names:
            "1": up
            "2": down
            "3": testing
            "4": unknown
            "5": dormant
            "6": notPresent
            "7": lowerLayerDown
      # TimeTicks are centiseconds. A counter that wrapped is emitted as read.
      - name: system-uptime
        match:
          metric: snmp.system.uptime
        target: system.uptime
        unit: s
        scale: 0.01
      # Wi-Fi radio utilization from percent to a ratio; the names stay and a value above 100 is not cut.
      - name: wifi-utilization-channel
        match:
          metric: wifi.radio.utilization.channel
        target: wifi.radio.utilization.channel
        unit: "1"
        scale: 0.01
      - name: wifi-utilization-rx
        match:
          metric: wifi.radio.utilization.rx
        target: wifi.radio.utilization.rx
        unit: "1"
        scale: 0.01
      - name: wifi-utilization-tx
        match:
          metric: wifi.radio.utilization.tx
        target: wifi.radio.utilization.tx
        unit: "1"
        scale: 0.01
      # Interface speed: Mbit/s to bytes per second (1 Mbit/s is 125000 By/s). A speed of 0 stays 0.
      - name: interface-bandwidth-limit
        match:
          metric: snmp.interface.high_speed
        target: hw.network.bandwidth.limit
        unit: By/s
        scale: 125000
        labels:
          hw.type: network
          hw.id: "{interface.index}"
          hw.name: "{interface}"
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    metrics:
      receivers: [snmp/switch]
      processors: [memory_limiter, hwmap, batch]
      exporters: [debug]
