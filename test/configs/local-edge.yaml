# Local Edge Collector Test Configuration
# Use for local development and debugging with VS Code
#
# Run: ./build/edge/otelcol-edge --config test/configs/local-edge.yaml
# Or use VS Code launch configuration: "Debug Edge Collector"
#
# This config:
# - Reads test logs from testdata/ directory
# - Uses debug exporter (stdout) instead of OTLP
# - Includes all edge processors for testing
# - Summarization is off: windowhist is not in the pipeline. To turn it on, add
#   a windowhist processor (scrape_interval 10s, send_interval 60s, groups cpu,
#   memory, psi and plain), put it in the metrics pipeline and set the host_metrics
#   and psi intervals to 10s.
# - No external dependencies required

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  zpages:
    endpoint: 127.0.0.1:55679
receivers:
  # AWS ENA allowance counters (custom, Linux only)
  ethtool:
    collection_interval: 60s
  # File-based log receiver for testing with sample data
  file_log/testdata:
    include:
      - testdata/logrus-logs/*.txt
      - testdata/cisco-logs/*.txt
      - testdata/ipsec-logs/*.txt
    start_at: beginning
    include_file_name: true
    include_file_path: true
    operators:
      - type: add
        field: attributes.source
        value: testdata
  # PSI receiver for metrics testing (reads from /proc/pressure/ or mock)
  # On macOS, this will fail gracefully - use Linux VM for full testing
  psi:
    collection_interval: 60s
  # Container CPU and memory from the Docker socket (Linux edge builds only).
  # The collector needs root or the docker group to read the socket; without
  # access it logs the error and keeps running. container.cpu.limit is off by
  # default and is turned on here; container.memory.usage.limit is on by default.
  # api_version must stay empty: the receiver's own default is 1.44, which a daemon whose API tops out
  # lower (Docker 24 stops at 1.43) rejects, and the collector then fails to start. Empty lets the client
  # negotiate the version with the daemon.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    api_version: ""
    collection_interval: 60s
    metrics:
      container.cpu.limit:
        enabled: true
      container.memory.usage.limit:
        enabled: true
  # Host metrics for testing (works on macOS and Linux)
  host_metrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          # The cpu attribute is opt-in since hostmetrics 0.164; without it the
          # scraper sums all cores into one series per state.
          system.cpu.time:
            attributes: [cpu, state]
          system.cpu.utilization:
            enabled: true
            attributes: [cpu, state]
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      # system.processes.count and system.processes.created; off by default, and one host sent them
      processes: {}
  # Hourly process metrics - cpu.time and uptime for long-running processes
  # Using 30s for local testing (production uses 1h)
  host_metrics/process_hourly:
    collection_interval: 30s # Short interval for testing
    scrapers:
      process:
        metrics:
          process.cpu.time:
            enabled: true
          process.cpu.utilization:
            enabled: false
          process.memory.usage:
            enabled: false
          process.memory.virtual:
            enabled: false
          process.memory.utilization:
            enabled: false
          # processlifetime divides cpu.time and disk.io by uptime, so all three are on
          process.disk.io:
            enabled: true
          process.uptime:
            enabled: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 100
  # Resource detection (hostname, OS info)
  resource_detection:
    detectors: [system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
  # Add development environment marker
  resource/host:
    attributes:
      - key: deployment.environment
        value: development
        action: insert
  # Multi-line recombination (custom): Docker journald lines are grouped per container, not per daemon PID
  logrecombine:
    container_identifier: body.CONTAINER_ID
  # Container name (custom): service.name from container.name on Docker journald logs and docker_stats metrics
  containername: {}
  # Process lifetime (custom): CPU time and disk bytes divided by process.uptime. Runs before kthread
  processlifetime: {}
  # Kernel threads (custom): one aggregate resource per scrape in place of per-pid kernel-thread series
  kthread:
    patterns: [kworker*, ksoftirqd*, migration*]
    aggregate_name: kernel_threads
  # Normalized load processor (custom)
  normalizedload:
    cpu_count: 0 # auto-detect
  # Filter low-resource process metrics (if process scraper enabled)
  filter/process:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "process.memory.usage" and value_double < 52428800.0'
        - 'metric.name == "process.cpu.utilization" and value_double < 0.001'
  # Filter for hourly process metrics - only keep processes running > 30 minutes
  # Using 60s for local testing (production uses 1800s = 30 min)
  filter/process_hourly:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "process.uptime" and value_double < 60.0'
exporters:
  # Debug exporter - prints to stdout
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 10
  # File exporter for persistent output review
  file/logs:
    path: /tmp/otel-edge-logs.json
    rotation:
      max_megabytes: 10
      max_backups: 3
  file/metrics:
    path: /tmp/otel-edge-metrics.json
    rotation:
      max_megabytes: 10
      max_backups: 3
service:
  extensions: [health_check, zpages]
  telemetry:
    logs:
      level: debug
    metrics:
      level: none # Disable collector self-telemetry for local testing
  pipelines:
    logs:
      receivers: [file_log/testdata]
      processors: [memory_limiter, resource_detection, resource/host, containername, batch]
      exporters: [debug, file/logs]
    metrics:
      receivers: [host_metrics, psi, docker_stats]
      processors: [memory_limiter, filter/process, normalizedload, resource_detection, resource/host, containername, batch]
      exporters: [debug, file/metrics]
    metrics/network_allowance:
      receivers: [ethtool]
      processors: [memory_limiter, resource_detection, resource/host, batch]
      exporters: [debug, file/metrics]
    # Hourly process metrics - cpu.time and uptime for long-running processes
    metrics/process_hourly:
      receivers: [host_metrics/process_hourly]
      processors: [memory_limiter, processlifetime, kthread, filter/process_hourly, resource_detection, resource/host, batch]
      exporters: [debug, file/metrics]
