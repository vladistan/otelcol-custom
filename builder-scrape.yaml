# Narrowed otelcol-scrape manifest for cloud source scraping. The local
# modules are auth0receiver, cloudwatchmetricsreceiver, sourcetagprocessor, identityfillprocessor and
# hwmapprocessor. CloudWatch metrics come
# from cloudwatchmetricsreceiver; awscloudwatchreceiver reads CloudWatch logs; Cloud Monitoring metrics come from
# googlecloudmonitoringreceiver, a vendored copy with an aggregation block.
dist:
  name: otelcol-scrape
  description: Cloud source scraping collector (AWS, GCP, Azure)
  output_path: ./build/scrape
  # dist is generated only; the entrypoint with Sentry init is injected and compiled afterwards
  skip_compilation: true
replaces:
  # Pin sentry-go to the version cmd/otelcol-custom compiles against. The builder
  # compiles before the entrypoint is copied in; unpinned it takes the newest release.
  - github.com/getsentry/sentry-go => github.com/getsentry/sentry-go v0.29.1
  - github.com/vladistan/otelcol-custom/receiver/auth0receiver => ../../receiver/auth0receiver
  - github.com/vladistan/otelcol-custom/receiver/cloudwatchmetricsreceiver => ../../receiver/cloudwatchmetricsreceiver
  - github.com/vladistan/otelcol-custom/receiver/ipmireceiver => ../../receiver/ipmireceiver
  - github.com/vladistan/otelcol-custom/receiver/hwschema => ../../receiver/hwschema
  - github.com/vladistan/otelcol-custom/receiver/pvereceiver => ../../receiver/pvereceiver
  # go-ipmi is pre-1.0: the version is pinned here, and a bump is a deliberate change.
  - github.com/bougou/go-ipmi => github.com/bougou/go-ipmi v0.9.2
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awscloudwatchreceiver => ../../receiver/awscloudwatchreceiver
  # AWS logs encoding with a local patch: an ALB line with an unbracketed IPv6 address no longer fails the object
  # yamllint disable-line rule:line-length
  - github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/awslogsencodingextension => ../../extension/encoding/awslogsencodingextension
  # yamllint disable-line rule:line-length
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudmonitoringreceiver => ../../receiver/googlecloudmonitoringreceiver
  - github.com/vladistan/otelcol-custom/processor/sourcetagprocessor => ../../processor/sourcetagprocessor
  - github.com/vladistan/otelcol-custom/processor/identityfillprocessor => ../../processor/identityfillprocessor
  - github.com/vladistan/otelcol-custom/processor/logshapeprocessor => ../../processor/logshapeprocessor
  # cspell:ignore hwmap hwmapprocessor
  - github.com/vladistan/otelcol-custom/processor/hwmapprocessor => ../../processor/hwmapprocessor
  # cspell:ignore k8slift
  - github.com/vladistan/otelcol-custom/shape/body => ../../shape/body
  - github.com/vladistan/otelcol-custom/shape/httpaccess => ../../shape/httpaccess
  - github.com/vladistan/otelcol-custom/shape/k8slift => ../../shape/k8slift
  - github.com/vladistan/otelcol-custom/shape/multiline => ../../shape/multiline
  - github.com/vladistan/otelcol-custom/shape/principal => ../../shape/principal
  - github.com/vladistan/otelcol-custom/shape/rename => ../../shape/rename
  - github.com/vladistan/otelcol-custom/shape/severity => ../../shape/severity
  - github.com/vladistan/otelcol-custom/shape/strip => ../../shape/strip
extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  # type aws_logs_encoding: CloudTrail and S3 access log formats
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/awslogsencodingextension v0.164.1
  # type google_cloud_logentry_encoding: Cloud Run and audit log entries
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/googlecloudlogentryencodingextension v0.164.1
receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awss3receiver v0.164.1
  # CloudWatch Logs
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awscloudwatchreceiver v0.164.1
  # CloudWatch metrics: accounts, regions and tiers in one instance
  - gomod: github.com/vladistan/otelcol-custom/receiver/cloudwatchmetricsreceiver v0.0.0
  # Lab BMC sensors over IPMI; runs in a Deployment of its own (docs/scrape-collector.md)
  - gomod: github.com/vladistan/otelcol-custom/receiver/ipmireceiver v0.0.0
  # Proxmox VE cluster resources and guest agent facts, one instance per node (docs/scrape-collector.md)
  - gomod: github.com/vladistan/otelcol-custom/receiver/pvereceiver v0.0.0
  # SNMP devices read by OID, one instance per device (contrib, alpha)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/snmpreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudpubsubreceiver v0.164.1
  # metrics: Cloud Run metrics, one project per receiver instance
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudmonitoringreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/azureeventhubreceiver v0.164.1
  - gomod: github.com/vladistan/otelcol-custom/receiver/auth0receiver v0.0.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  - gomod: github.com/vladistan/otelcol-custom/processor/sourcetagprocessor v0.0.0
  - gomod: github.com/vladistan/otelcol-custom/processor/identityfillprocessor v0.0.0
  - gomod: github.com/vladistan/otelcol-custom/processor/logshapeprocessor v0.0.0
  # hwmap: maps raw SNMP metrics to hw.* names by config rules (docs/hwmap.md)
  - gomod: github.com/vladistan/otelcol-custom/processor/hwmapprocessor v0.0.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
