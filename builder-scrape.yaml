# Narrowed otelcol-scrape manifest for cloud source scraping. The local
# modules are auth0receiver, sourcetagprocessor and identityfillprocessor. CloudWatch metrics come from the metrics block of
# awscloudwatchreceiver; Cloud Monitoring metrics come from
# googlecloudmonitoringreceiver.
dist:
  name: otelcol-scrape
  description: Cloud source scraping collector (AWS, GCP, Azure)
  output_path: ./build/scrape
  # dist is generated only; the entrypoint with Sentry init is injected and compiled afterwards
  skip_compilation: true
replaces:
  - github.com/vladistan/otelcol-custom/receiver/auth0receiver => ../../receiver/auth0receiver
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awscloudwatchreceiver => ../../receiver/awscloudwatchreceiver
  - github.com/vladistan/otelcol-custom/processor/sourcetagprocessor => ../../processor/sourcetagprocessor
  - github.com/vladistan/otelcol-custom/processor/identityfillprocessor => ../../processor/identityfillprocessor
extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  # type aws_logs_encoding: CloudTrail and S3 access log formats
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/awslogsencodingextension v0.164.1
  # type google_cloud_logentry_encoding: Cloud Run and audit log entries
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/encoding/googlecloudlogentryencodingextension v0.164.1
receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awss3receiver v0.164.1
  # logs and metrics (metrics.queries)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/awscloudwatchreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudpubsubreceiver v0.164.1
  # metrics: Cloud Run metrics, one project per receiver instance
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudmonitoringreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/azureeventhubreceiver v0.164.1
  - gomod: github.com/vladistan/otelcol-custom/receiver/auth0receiver v0.0.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  - gomod: github.com/vladistan/otelcol-custom/processor/sourcetagprocessor v0.0.0
  - gomod: github.com/vladistan/otelcol-custom/processor/identityfillprocessor v0.0.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
