dist:
  name: otelcol-edge
  description: Lean edge collector for Windows hosts
  output_path: ./build/edge-windows
  # Skip compilation - we compile manually after injecting custom main.go for Sentry
  skip_compilation: true
# =============================================================================
# Windows edge: builder-edge-static.yaml minus journaldreceiver and
# psireceiver, plus windowsperfcountersreceiver and windowseventlogreceiver.
# check-edge-windows-manifest holds this list; extend it when a component is
# added here.
# =============================================================================
# =============================================================================
# Replaces - Local module overrides for custom components
# =============================================================================
replaces:
  # Custom components from this repository (paths relative to build/edge-windows/ directory)
  - github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor => ../../processor/normalizedloadprocessor
  - github.com/vladistan/otelcol-custom/processor/resourceversionprocessor => ../../processor/resourceversionprocessor
  - github.com/vladistan/otelcol-custom/processor/logrecombineprocessor => ../../processor/logrecombineprocessor
  # Custom stanza operators (for log processing pipelines)
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/arraytostring => ../../stanza/operator/transformer/arraytostring
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/ansistrip => ../../stanza/operator/transformer/ansistrip
  # - github.com/vladistan/otelcol-custom/processor/windowhistprocessor => ../../processor/windowhistprocessor   # Step 6.1, 05 C-5
  # - github.com/vladistan/otelcol-custom/processor/winlogprocessor => ../../processor/winlogprocessor   # Step 4.1, 05 C-4
# =============================================================================
# Extensions - Minimal set for edge deployments
# =============================================================================
extensions:
  # Health check endpoint for monitoring
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.154.0
  # Debug endpoints (/debug/tracez, /debug/pipelinez)
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.154.0
  # Persistent queue storage and event-log bookmarks (survive restarts)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.154.0
# =============================================================================
# Receivers - Edge-specific sources only
# =============================================================================
receivers:
  # --- Logs ---
  # File-based logs (application logs)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.154.0
  # Windows Event Log channels
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/windowseventlogreceiver v0.154.0
  # --- Metrics ---
  # Host metrics (CPU, memory, network, filesystem, paging, process)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.154.0
  # Windows performance counters
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/windowsperfcountersreceiver v0.154.0
# =============================================================================
# Processors - Minimal processing for edge
# =============================================================================
processors:
  # --- Core ---
  # Batch telemetry for network efficiency
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.154.0
  # Prevent OOM conditions
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.154.0
  # --- Resource ---
  # Auto-detect host info (hostname, OS, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.154.0
  # Add/modify resource attributes (for resource/host config)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.154.0
  # --- Transform ---
  # OTTL-based metric/log transformations
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.154.0
  # OTTL-based filtering (drop low-resource process metrics)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.154.0
  # Modify log/metric attributes (upsert, delete, extract, convert, hash)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.154.0
  # --- Custom (local) ---
  # Normalized load average (load / CPU count)
  - gomod: github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor v0.0.0
  # Resource version (adds collector.{role}.version to resources)
  - gomod: github.com/vladistan/otelcol-custom/processor/resourceversionprocessor v0.0.0
  # Log recombine (multiline log combination without noisy errors)
  - gomod: github.com/vladistan/otelcol-custom/processor/logrecombineprocessor v0.0.0
    # - gomod: github.com/vladistan/otelcol-custom/processor/windowhistprocessor v0.0.0   # Step 6.1, 05 C-5
    # - gomod: github.com/vladistan/otelcol-custom/processor/winlogprocessor v0.0.0   # Step 4.1, 05 C-4
# =============================================================================
# Exporters - Forward to gateway only
# =============================================================================
exporters:
  # OTLP gRPC (edge → gateway via gRPC)
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.154.0
  # OTLP HTTP (edge → gateway via HTTP/protobuf)
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.154.0
  # File exporter for local metrics validation
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.154.0
  # Debug output for troubleshooting
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.154.0
