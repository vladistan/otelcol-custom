dist:
  name: otelcol-edge
  description: Lean edge collector for Windows hosts
  output_path: ./build/edge-windows
  # dist is generated only; the entrypoint with Sentry init is injected and compiled afterwards
  skip_compilation: true
# =============================================================================
# Windows edge: builder-edge-static.yaml minus journaldreceiver and
# psireceiver, plus windowsperfcountersreceiver, windowseventlogreceiver,
# gpureceiver, fswatchreceiver, windiskhealthreceiver, sqlserverreceiver, winlogprocessor and
# tightvncprocessor.
# inventoryreceiver is in the static edge as well, so it is no difference.
# check-edge-windows-manifest holds this list; extend it when a component is
# added here.
# =============================================================================
# =============================================================================
# Replaces - Local module overrides for custom components
# =============================================================================
replaces:
  # Pin sentry-go to the version cmd/otelcol-custom compiles against. The builder
  # compiles before the entrypoint is copied in; unpinned it takes the newest release.
  - github.com/getsentry/sentry-go => github.com/getsentry/sentry-go v0.29.1
  # Custom components from this repository (paths relative to build/edge-windows/ directory)
  - github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor => ../../processor/normalizedloadprocessor
  - github.com/vladistan/otelcol-custom/processor/resourceversionprocessor => ../../processor/resourceversionprocessor
  - github.com/vladistan/otelcol-custom/processor/logrecombineprocessor => ../../processor/logrecombineprocessor
  - github.com/vladistan/otelcol-custom/processor/logshapeprocessor => ../../processor/logshapeprocessor
  - github.com/vladistan/otelcol-custom/shape/multiline => ../../shape/multiline
  - github.com/vladistan/otelcol-custom/shape/severity => ../../shape/severity
  - github.com/vladistan/otelcol-custom/shape/strip => ../../shape/strip
  # cspell:ignore k8slift
  - github.com/vladistan/otelcol-custom/shape/body => ../../shape/body
  - github.com/vladistan/otelcol-custom/shape/httpaccess => ../../shape/httpaccess
  - github.com/vladistan/otelcol-custom/shape/k8slift => ../../shape/k8slift
  - github.com/vladistan/otelcol-custom/shape/principal => ../../shape/principal
  - github.com/vladistan/otelcol-custom/shape/rename => ../../shape/rename
  # Custom stanza operators (for log processing pipelines)
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/arraytostring => ../../stanza/operator/transformer/arraytostring
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/ansistrip => ../../stanza/operator/transformer/ansistrip
  - github.com/vladistan/otelcol-custom/processor/windowhistprocessor => ../../processor/windowhistprocessor
  - github.com/vladistan/otelcol-custom/processor/winlogprocessor => ../../processor/winlogprocessor
  - github.com/vladistan/otelcol-custom/processor/tightvncprocessor => ../../processor/tightvncprocessor
  - github.com/vladistan/otelcol-custom/receiver/gpureceiver => ../../receiver/gpureceiver
  - github.com/vladistan/otelcol-custom/receiver/fswatchreceiver => ../../receiver/fswatchreceiver
  - github.com/vladistan/otelcol-custom/receiver/windiskhealthreceiver => ../../receiver/windiskhealthreceiver
  - github.com/vladistan/otelcol-custom/receiver/smartdecode => ../../receiver/smartdecode
  - github.com/vladistan/otelcol-custom/receiver/hwschema => ../../receiver/hwschema
  - github.com/vladistan/otelcol-custom/receiver/inventoryreceiver => ../../receiver/inventoryreceiver
# =============================================================================
# Extensions - Minimal set for edge deployments
# =============================================================================
extensions:
  # Health check endpoint for monitoring
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  # Debug endpoints (/debug/tracez, /debug/pipelinez)
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  # Persistent queue storage and event-log bookmarks (survive restarts)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
# =============================================================================
# Receivers - Edge-specific sources only
# =============================================================================
receivers:
  # --- Logs ---
  # File-based logs (application logs)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  # Windows Event Log channels
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/windowseventlogreceiver v0.164.1
  # One log record per new file under watched directories
  - gomod: github.com/vladistan/otelcol-custom/receiver/fswatchreceiver v0.0.0
  # --- Metrics ---
  # Host metrics (CPU, memory, network, filesystem, paging, process)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
  # Windows performance counters
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/windowsperfcountersreceiver v0.164.1
  # SQL Server on one host (direct connection; query text is dropped in the sample config)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver v0.164.1
  # NVIDIA GPU metrics through nvml.dll (no cgo)
  - gomod: github.com/vladistan/otelcol-custom/receiver/gpureceiver v0.0.0
  # Physical disk health through DeviceIoControl (no external program)
  - gomod: github.com/vladistan/otelcol-custom/receiver/windiskhealthreceiver v0.0.0
  # Daily hardware facts (CPU, memory modules, board, drives, GPU) as info gauges
  - gomod: github.com/vladistan/otelcol-custom/receiver/inventoryreceiver v0.0.0
  # TCP connectivity probe (IPv4 and bracketed IPv6 targets)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tcpcheckreceiver v0.164.1
# =============================================================================
# Processors - Minimal processing for edge
# =============================================================================
processors:
  # --- Core ---
  # Batch telemetry for network efficiency
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  # Prevent OOM conditions
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  # --- Resource ---
  # Auto-detect host info (hostname, OS, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  # Add/modify resource attributes (for resource/host config)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1
  # --- Transform ---
  # OTTL-based metric/log transformations
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  # OTTL-based filtering (drop low-resource process metrics)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.164.1
  # Modify log/metric attributes (upsert, delete, extract, convert, hash)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  # --- Custom (local) ---
  # Normalized load average (load / CPU count)
  - gomod: github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor v0.0.0
  # Resource version (adds collector.{role}.version to resources)
  - gomod: github.com/vladistan/otelcol-custom/processor/resourceversionprocessor v0.0.0
  # Log recombine (multiline log combination without noisy errors)
  - gomod: github.com/vladistan/otelcol-custom/processor/logrecombineprocessor v0.0.0
  # Log shaping (severity, body, rename, strip, multiline, principal)
  - gomod: github.com/vladistan/otelcol-custom/processor/logshapeprocessor v0.0.0
  # Window histograms (summarizes sampled metrics into histograms per send window)
  - gomod: github.com/vladistan/otelcol-custom/processor/windowhistprocessor v0.0.0
  - gomod: github.com/vladistan/otelcol-custom/processor/winlogprocessor v0.0.0
  # TightVNC server log lines read by filelog: parse, severity, drops noise
  - gomod: github.com/vladistan/otelcol-custom/processor/tightvncprocessor v0.0.0
# =============================================================================
# Exporters - Forward to gateway only
# =============================================================================
exporters:
  # OTLP gRPC (edge → gateway via gRPC)
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  # OTLP HTTP (edge → gateway via HTTP/protobuf)
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  # File exporter for local metrics validation
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.164.1
  # Debug output for troubleshooting
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
# =============================================================================
# Providers - the five that cmd/otelcol-custom registers. An explicit list replaces the builder default, so
# every provider the entrypoint imports is named here to keep its pinned version; check-edge-windows-manifest
# compares the list with the imports of main.go.
# =============================================================================
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.70.0
