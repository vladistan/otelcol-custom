dist:
  name: otelcol-edge
  description: Lean edge collector for VMs and bare metal hosts
  output_path: ./build/edge
  # Skip compilation - we compile manually after injecting custom main.go for Sentry
  skip_compilation: true
# =============================================================================
# Replaces - Local module overrides for custom components
# =============================================================================
replaces:
  # Custom components from this repository (paths relative to build/edge/ directory)
  - github.com/vladistan/otelcol-custom/receiver/psireceiver => ../../receiver/psireceiver
  - github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor => ../../processor/normalizedloadprocessor
  - github.com/vladistan/otelcol-custom/processor/resourceversionprocessor => ../../processor/resourceversionprocessor
  - github.com/vladistan/otelcol-custom/processor/logrecombineprocessor => ../../processor/logrecombineprocessor
  # Custom stanza operators (for log processing pipelines)
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/arraytostring => ../../stanza/operator/transformer/arraytostring
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/ansistrip => ../../stanza/operator/transformer/ansistrip
# =============================================================================
# Extensions - Minimal set for edge deployments
# =============================================================================
extensions:
  # Health check endpoint for monitoring and systemd
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.140.0
  # Debug endpoints (/debug/tracez, /debug/pipelinez)
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.140.0
  # Persistent queue storage for sending_queue resilience (survives restarts)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.140.0
# =============================================================================
# Receivers - Edge-specific sources only
# =============================================================================
receivers:
  # --- Logs ---
  # System journal logs (primary log source for edge collectors)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.140.0
  # File-based logs (application logs, Docker container logs)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.140.0
  # --- Metrics ---
  # Host metrics (CPU, memory, disk, network, load, paging, filesystem)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.140.0
  # --- Custom (local) ---
  # PSI (Pressure Stall Information) metrics from /proc/pressure
  - gomod: github.com/vladistan/otelcol-custom/receiver/psireceiver v0.0.0
# =============================================================================
# Processors - Minimal processing for edge
# =============================================================================
processors:
  # --- Core ---
  # Batch telemetry for network efficiency
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.140.0
  # Prevent OOM conditions
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.140.0
  # --- Resource ---
  # Auto-detect host info (hostname, OS, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.140.0
  # Add/modify resource attributes (for resource/host config)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.140.0
  # --- Transform ---
  # OTTL-based metric/log transformations (for CPU % normalization, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.140.0
  # OTTL-based filtering (drop low-resource process metrics)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.140.0
  # Modify log/metric attributes (upsert, delete, extract, convert, hash)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.140.0
  # --- Custom (local) ---
  # Normalized load average (load / CPU count)
  - gomod: github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor v0.0.0
  # Resource version (adds collector.{role}.version to resources)
  - gomod: github.com/vladistan/otelcol-custom/processor/resourceversionprocessor v0.0.0
  # Log recombine (multiline log combination without noisy errors)
  - gomod: github.com/vladistan/otelcol-custom/processor/logrecombineprocessor v0.0.0
# =============================================================================
# Exporters - Forward to gateway only
# =============================================================================
exporters:
  # OTLP gRPC (edge → gateway via gRPC)
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.140.0
  # OTLP HTTP (edge → gateway via HTTP/protobuf)
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.140.0
  # File exporter for local metrics validation
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.140.0
  # Debug output for troubleshooting
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.140.0
