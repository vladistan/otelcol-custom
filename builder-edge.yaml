dist:
  name: otelcol-edge
  description: Lean edge collector for VMs and bare metal hosts
  output_path: ./build/edge
  # dist is generated only; the entrypoint with Sentry init is injected and compiled afterwards
  skip_compilation: true
# =============================================================================
# Replaces - Local module overrides for custom components
# =============================================================================
replaces:
  # Pin sentry-go to the version cmd/otelcol-custom compiles against. The builder
  # compiles before the entrypoint is copied in; unpinned it takes the newest release.
  - github.com/getsentry/sentry-go => github.com/getsentry/sentry-go v0.29.1
  # Custom components from this repository (paths relative to build/edge/ directory)
  - github.com/vladistan/otelcol-custom/receiver/psireceiver => ../../receiver/psireceiver
  - github.com/vladistan/otelcol-custom/receiver/ethtoolreceiver => ../../receiver/ethtoolreceiver
  - github.com/vladistan/otelcol-custom/receiver/pvereceiver => ../../receiver/pvereceiver
  - github.com/vladistan/otelcol-custom/receiver/gpureceiver => ../../receiver/gpureceiver
  - github.com/vladistan/otelcol-custom/receiver/openvpnstatusreceiver => ../../receiver/openvpnstatusreceiver
  - github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor => ../../processor/normalizedloadprocessor
  - github.com/vladistan/otelcol-custom/processor/resourceversionprocessor => ../../processor/resourceversionprocessor
  - github.com/vladistan/otelcol-custom/processor/logrecombineprocessor => ../../processor/logrecombineprocessor
  # Custom stanza operators (for log processing pipelines)
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/arraytostring => ../../stanza/operator/transformer/arraytostring
  - github.com/vladistan/otelcol-custom/stanza/operator/transformer/ansistrip => ../../stanza/operator/transformer/ansistrip
  - github.com/vladistan/otelcol-custom/processor/windowhistprocessor => ../../processor/windowhistprocessor
  - github.com/vladistan/otelcol-custom/processor/containernameprocessor => ../../processor/containernameprocessor
  - github.com/vladistan/otelcol-custom/processor/kthreadprocessor => ../../processor/kthreadprocessor
  - github.com/vladistan/otelcol-custom/processor/processlifetimeprocessor => ../../processor/processlifetimeprocessor
  - github.com/vladistan/otelcol-custom/receiver/zfskstatreceiver => ../../receiver/zfskstatreceiver
  - github.com/vladistan/otelcol-custom/receiver/hwmonreceiver => ../../receiver/hwmonreceiver
  - github.com/vladistan/otelcol-custom/receiver/iscsireceiver => ../../receiver/iscsireceiver
# =============================================================================
# Extensions - Minimal set for edge deployments
# =============================================================================
extensions:
  # Health check endpoint for monitoring and systemd
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  # Lists the pods of this node for receiver_creator (DaemonSet edge; Linux only)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/observer/k8sobserver v0.164.1
  # Debug endpoints (/debug/tracez, /debug/pipelinez)
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  # Persistent queue storage for sending_queue resilience (survives restarts)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
# =============================================================================
# Receivers - Edge-specific sources only
# =============================================================================
receivers:
  # --- Logs ---
  # System journal logs (primary log source for edge collectors)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/journaldreceiver v0.164.1
  # File-based logs (application logs, Docker container logs)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  # --- Metrics ---
  # Host metrics (CPU, memory, disk, network, load, paging, filesystem)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
  # TCP connectivity probe (IPv4 and bracketed IPv6 targets)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tcpcheckreceiver v0.164.1
  # Scrape Prometheus exporters on the host (node_exporter and similar)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.164.1
  # Start receivers for pods the observer finds, from rules (DaemonSet edge; Linux only)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/receivercreator v0.164.1
  # Application receivers for the creator's rules (Linux edge only; credentials from env or file)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/redisreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/postgresqlreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/mysqlreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/mongodbreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/rabbitmqreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/nginxreceiver v0.164.1
  # Container CPU, memory, network and block I/O from the Docker socket (Linux only)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver v0.164.1
  # SNMP devices read by OID (contrib, alpha)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/snmpreceiver v0.164.1
  # NetFlow, IPFIX and sFlow records as logs (contrib, alpha)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/netflowreceiver v0.164.1
  # --- Custom (local) ---
  # PSI (Pressure Stall Information) metrics from /proc/pressure
  - gomod: github.com/vladistan/otelcol-custom/receiver/psireceiver v0.0.0
  # AWS ENA network allowance counters, read by ioctl
  - gomod: github.com/vladistan/otelcol-custom/receiver/ethtoolreceiver v0.0.0
  # Proxmox VE cluster resources and guest agent facts over the HTTP API
  - gomod: github.com/vladistan/otelcol-custom/receiver/pvereceiver v0.0.0
  # ZFS pool I/O, pool state and ARC metrics from /proc/spl/kstat/zfs
  - gomod: github.com/vladistan/otelcol-custom/receiver/zfskstatreceiver v0.0.0
  # Temperature, fan and voltage sensors (hw.*) from sysfs hwmon and thermal zones
  - gomod: github.com/vladistan/otelcol-custom/receiver/hwmonreceiver v0.0.0
  # iSCSI initiator sessions from sysfs
  - gomod: github.com/vladistan/otelcol-custom/receiver/iscsireceiver v0.0.0
  - gomod: github.com/vladistan/otelcol-custom/receiver/gpureceiver v0.0.0
  # OpenVPN status file: one log record per connected client
  - gomod: github.com/vladistan/otelcol-custom/receiver/openvpnstatusreceiver v0.0.0
# =============================================================================
# Processors - Minimal processing for edge
# =============================================================================
processors:
  # --- Core ---
  # Batch telemetry for network efficiency
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  # Prevent OOM conditions
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  # --- Resource ---
  # Auto-detect host info (hostname, OS, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  # Add/modify resource attributes (for resource/host config)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1
  # --- Transform ---
  # OTTL-based metric/log transformations (for CPU % normalization, etc.)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  # OTTL-based filtering (drop low-resource process metrics)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.164.1
  # Modify log/metric attributes (upsert, delete, extract, convert, hash)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  # Pod name and namespace from k8s.pod.uid (DaemonSet edge; Linux only)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v1.3.1
  # --- Custom (local) ---
  # Normalized load average (load / CPU count)
  - gomod: github.com/vladistan/otelcol-custom/processor/normalizedloadprocessor v0.0.0
  # Resource version (adds collector.{role}.version to resources)
  - gomod: github.com/vladistan/otelcol-custom/processor/resourceversionprocessor v0.0.0
  # Log recombine (multiline log combination without noisy errors)
  - gomod: github.com/vladistan/otelcol-custom/processor/logrecombineprocessor v0.0.0
  # Window histograms (summarizes sampled metrics into histograms per send window)
  - gomod: github.com/vladistan/otelcol-custom/processor/windowhistprocessor v0.0.0
  # Container name (sets service.name from container.name on Docker journald logs)
  - gomod: github.com/vladistan/otelcol-custom/processor/containernameprocessor v0.0.0
  # Kernel threads (one aggregate per host in place of per-pid process metrics)
  - gomod: github.com/vladistan/otelcol-custom/processor/kthreadprocessor v0.0.0
  # Process lifetime (CPU time and disk bytes over process age)
  - gomod: github.com/vladistan/otelcol-custom/processor/processlifetimeprocessor v0.0.0
# =============================================================================
# Exporters - Forward to gateway only
# =============================================================================
exporters:
  # OTLP gRPC (edge → gateway via gRPC)
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  # OTLP HTTP (edge → gateway via HTTP/protobuf)
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  # File exporter for local metrics validation
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.164.1
  # Debug output for troubleshooting
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
